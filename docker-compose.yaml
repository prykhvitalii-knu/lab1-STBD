version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: store_postgres
    restart: always
    environment:
      POSTGRES_USER: store_admin
      POSTGRES_PASSWORD: SecretPassword123!
      POSTGRES_DB: StoreDB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:latest
    container_name: store_mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_admin
      MONGO_INITDB_ROOT_PASSWORD: MongoPassword123!
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: store_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  mongo_data:
  redis_data: